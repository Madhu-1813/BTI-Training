name: Build-Test-Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Application
        run: mvn clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.java_kub_username }}
          password: ${{ secrets.java_kub_password }}

      - name: Build Docker Image
        run: |
          docker build -t madhu1813/my-java-app:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push madhu1813/my-java-app:${{ github.run_number }}

      - name: Update Deployment Repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Madhu-1813/my-java-app-deployment-repo2.git

          cd my-java-app-deployment-repo2

          sed -i "s|image:.*|image: madhu1813/my-java-app:${{ github.run_number }}|g" k8s/deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          git commit -m "Update image tag to ${{ github.run_number }}" || echo "No changes to commit"

          git push